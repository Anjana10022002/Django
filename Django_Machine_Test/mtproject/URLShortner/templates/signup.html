<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
        body {
            margin: auto;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #6C63FF, #A993FF);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 14px;
            width: 380px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 25px;
            color: #4b3ea3;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border-radius: 5px;
            border: 1px solid #bcb8ff;
            margin-bottom: 14px;
            font-size: 15px;
            
        }

        button {
            width: 100%;
            padding: 13px;
            background: #6C63FF;
            font-size: 18px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #584dcb;
        }

        .login-link {
            text-align: center;
            margin-top: 14px;
            font-size: 15px;
        }

        .login-link a {
            color: #6C63FF;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form method="POST">
            {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
