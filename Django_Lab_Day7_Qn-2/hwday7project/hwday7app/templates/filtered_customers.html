<!DOCTYPE html>
<html>
<head>
    <title>Filtered Customers</title>   
</head>
<body>  
    <h1>Filtered Customers</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>
        {% for customer in customers %}
        <tr>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
